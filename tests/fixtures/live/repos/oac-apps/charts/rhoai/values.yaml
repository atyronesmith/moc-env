enabled: true
rhoaiVersion: 2
applicationsNamespace: ai-applications
dataScienceCluster:
  name: default-dsc
  v2:
    components:
      codeflare: Managed
      dashboard: Managed
      datasciencepipelines: Managed
      kserve: Managed
      kueue: Managed
      modelmeshserving: Managed
      modelregistry: Removed
      ray: Managed
      trainingoperator: Managed
      trustyai: Managed
      workbenches: Managed
enabledHardwareProfiles: []
hardwareProfiles:
  - name: gpu-profile-a
    identifiers:
      - {identifier: cpu, displayName: CPU, resourceType: CPU, minCount: 1, maxCount: "14", defaultCount: 2}
      - {identifier: memory, displayName: Memory, resourceType: Memory, minCount: 2Gi, maxCount: 56Gi, defaultCount: 8Gi}
      - {identifier: nvidia.com/gpu, displayName: gpu, resourceType: Accelerator, minCount: 1, maxCount: 4, defaultCount: 1}
    scheduling:
      type: Node
      node:
        nodeSelector: {}
        tolerations:
          - {key: nvidia.com/gpu.product, operator: Equal, value: NVIDIA-H100-80GB-HBM3, effect: NoSchedule}
  - name: gpu-profile-b
    identifiers:
      - {identifier: cpu, displayName: CPU, resourceType: CPU, minCount: 1, maxCount: "14", defaultCount: 2}
      - {identifier: memory, displayName: Memory, resourceType: Memory, minCount: 2Gi, maxCount: 56Gi, defaultCount: 8Gi}
      - {identifier: nvidia.com/gpu, displayName: gpu, resourceType: Accelerator, minCount: 1, maxCount: 4, defaultCount: 1}
    scheduling:
      type: Node
      node:
        nodeSelector: {}
        tolerations:
          - {key: nvidia.com/gpu.product, operator: Equal, value: NVIDIA-A100-SXM4-40GB, effect: NoSchedule}
