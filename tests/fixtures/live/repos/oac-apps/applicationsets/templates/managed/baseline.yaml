# Minimal synthetic ApplicationSet, not an upstream export.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: baseline
spec:
  placement:
    cluster.open-cluster-management.io/placement: all-managed-clusters
  elements:
    - component: jobset-operator
  template:
    spec:
      source:
        path: "charts/{{`{{component}}`}}"
        helm:
          valueFiles:
            - "/values/{{ $hub }}/{{`{{component}}`}}.yaml"
            - "/values/{{ $hub }}/{{`{{name}}`}}/{{`{{component}}`}}.yaml"
