[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moc-env-status"
version = "0.1.0"
description = "Read-only configuration-state reporter for Mass Open Cloud environments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2",
]
authors = [
  { name = "MOC Env Maintainers" },
]

[project.scripts]
moc-env-status = "moc_env_status.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/moc_env_status"]

[tool.ruff]
line-length = 100
target-version = "py311"
