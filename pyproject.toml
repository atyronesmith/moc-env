[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moc-env"
version = "0.1.0"
description = "Configuration-state and desired-state tooling for Mass Open Cloud environments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2",
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.6",
  "mypy>=1.13",
  "ruff>=0.9",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
moc-env = "moc_env.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/moc_env"]

[tool.hatch.build.targets.wheel.force-include]
"docs/sources.yaml" = "moc_env/docs/sources.yaml"
"docs/variables" = "moc_env/docs/variables"
"src/moc_env/data/environments.yaml" = "moc_env/data/environments.yaml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tools/generate_report_fixtures.py" = ["E402"]

[tool.coverage.run]
branch = true
source = ["moc_env"]

[tool.coverage.report]
fail_under = 84
show_missing = true
skip_covered = true

[tool.mypy]
files = ["src/moc_env"]
python_version = "3.11"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
