[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moc-env"
version = "0.1.0"
description = "Configuration-state and desired-state tooling for Mass Open Cloud environments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2",
]
authors = [
  { name = "MOC Env Maintainers" },
]

[project.scripts]
moc-env = "moc_env.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/moc_env"]

[tool.ruff]
line-length = 100
target-version = "py311"
